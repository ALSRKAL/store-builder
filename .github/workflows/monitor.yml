name: Read-only monitoring

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring
  cancel-in-progress: false

jobs:
  monitor:
    # Opt-in only. No cloud tokens, webhooks, deployments, or automatic recovery.
    if: vars.MONITORING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED }}
      MONITOR_URLS_JSON: ${{ vars.MONITOR_URLS_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Install exact locked monitoring tooling
        run: npm ci
      - name: Read-only HTTPS readiness and site probes
        run: node scripts/release/cli.mjs monitor
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monitor-${{ github.run_id }}
          path: .release/report.json
          retention-days: 14
          if-no-files-found: warn
