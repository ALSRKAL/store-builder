name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful staging Release run ID (promotes its exact production artifact and tested SHA)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      quality_run_id: ${{ steps.validate.outputs.quality_run_id }}
      stage_run_id: ${{ steps.validate.outputs.stage_run_id }}
      eligible: ${{ steps.validate.outputs.eligible }}
    steps:
      - name: Identify staging promotion artifact (manual production only)
        if: github.event_name == 'workflow_dispatch'
        id: stage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STAGE_RUN: ${{ inputs.staging_run_id }}
        with:
          script: |
            const id = process.env.STAGE_RUN;
            if (!/^\d+$/.test(id)) throw new Error('Invalid staging run ID');
            const {data:repo} = await github.rest.repos.get(context.repo);
            if (context.ref !== `refs/heads/${repo.default_branch}`) throw new Error('Manual release workflow must run on default branch');
            const {data:run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)});
            if (run.path !== '.github/workflows/release.yml' || run.event !== 'workflow_run' || run.status !== 'completed' || run.conclusion !== 'success' || run.repository.full_name !== context.payload.repository.full_name) throw new Error('Not a successful trusted staging release');
            core.setOutput('id', id);
      - name: Read immutable promotion manifest without executing artifact code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-${{ steps.stage.outputs.id }}
          run-id: ${{ steps.stage.outputs.id }}
          github-token: ${{ github.token }}
          path: promotion
      - name: Validate trusted default-branch Quality push and ancestry
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PRODUCTION_APPROVAL_CONFIGURED: ${{ vars.PRODUCTION_APPROVAL_CONFIGURED }}
          PRODUCTION_APPROVAL_MODE: ${{ vars.PRODUCTION_APPROVAL_MODE }}
          STAGE_RUN: ${{ steps.stage.outputs.id }}
        with:
          script: |
            const {data:repo} = await github.rest.repos.get(context.repo);
            let sha, qualityId;
            if (context.eventName === 'workflow_dispatch') {
              const manifest = JSON.parse(require('node:fs').readFileSync('promotion/manifest.json','utf8'));
              if (manifest.environment !== 'production' || manifest.repository !== repo.full_name) throw new Error('Wrong promotion artifact');
              sha = manifest.sha; qualityId = String(manifest.qualityRunId);
              if (process.env.PRODUCTION_APPROVAL_CONFIGURED !== 'true' || process.env.PRODUCTION_APPROVAL_MODE !== 'required-reviewers') throw new Error('Production approval not configured/attested');
              const {data:environment} = await github.rest.repos.getEnvironment({...context.repo,environment_name:'production'});
              const rule = environment.protection_rules?.find(rule => rule.type === 'required_reviewers');
              if (!rule?.reviewers?.length || rule.prevent_self_review !== true || environment.can_admins_bypass !== false) throw new Error('Required reviewers unsupported or bypassable: fail closed (private Free/Pro/Team may not support this gate)');
            } else {
              const run = context.payload.workflow_run;
              if (run.head_branch !== repo.default_branch) { core.setOutput('eligible','false'); return; }
              sha = run.head_sha; qualityId = String(run.id);
            }
            if (!/^[a-f0-9]{40}$/.test(sha) || !/^\d+$/.test(qualityId)) throw new Error('Invalid tested source');
            const {data:quality} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(qualityId)});
            if (quality.path !== '.github/workflows/quality.yml' || quality.event !== 'push' || quality.status !== 'completed' || quality.conclusion !== 'success' || quality.head_sha !== sha || quality.head_branch !== repo.default_branch || quality.repository.full_name !== repo.full_name || quality.head_repository.full_name !== repo.full_name || quality.pull_requests.length) throw new Error('Not successful default-branch push quality');
            const {data:runs} = await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'quality.yml',event:'push',branch:repo.default_branch,head_sha:sha,per_page:100});
            if (String(runs.workflow_runs.find(run => run.head_sha === sha && run.event === 'push')?.id) !== qualityId) throw new Error('Only latest Quality push run for SHA may release');
            const {data:comparison} = await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:`${sha}...${repo.default_branch}`});
            if (comparison.merge_base_commit.sha !== sha || !['ahead','identical'].includes(comparison.status)) throw new Error('SHA not ancestor of default branch');
            core.setOutput('sha',sha); core.setOutput('quality_run_id',qualityId); core.setOutput('stage_run_id',process.env.STAGE_RUN || ''); core.setOutput('eligible','true');
      - name: Source validation result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            require('node:fs').writeFileSync('source-result.json',JSON.stringify({status:process.env.RESULT,runId:context.runId,event:context.eventName}));
      - name: Ensure machine-readable job outcome even if setup/install failed
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync(".release",{recursive:true}); if(!fs.existsSync(".release/report.json")) fs.writeFileSync(".release/report.json",JSON.stringify({status:process.env.JOB_RESULT,runId:process.env.GITHUB_RUN_ID,reason:"setup or dependency installation did not complete"}));'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-source-${{ github.run_id }}
          path: source-result.json
          retention-days: 30

  build:
    needs: source
    if: needs.source.outputs.eligible == 'true' && github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        environment: [staging, production]
    env:
      RELEASE_ENVIRONMENT: ${{ matrix.environment }}
      RELEASE_STAGING_CONFIG: ${{ vars.RELEASE_STAGING_CONFIG }}
      RELEASE_PRODUCTION_CONFIG: ${{ vars.RELEASE_PRODUCTION_CONFIG }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      QUALITY_RUN_ID: ${{ needs.source.outputs.quality_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - name: Build environment-specific artifacts from the same tested SHA (no cloud secrets)
        run: node scripts/release/cli.mjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.environment }}-${{ github.run_id }}
          path: release-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Ensure machine-readable job outcome even if setup/install failed
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync(".release",{recursive:true}); if(!fs.existsSync(".release/report.json")) fs.writeFileSync(".release/report.json",JSON.stringify({status:process.env.JOB_RESULT,runId:process.env.GITHUB_RUN_ID,reason:"setup or dependency installation did not complete"}));'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-report-${{ matrix.environment }}-${{ github.run_id }}
          path: .release/report.json
          retention-days: 30
          if-no-files-found: warn

  staging:
    needs: [source, build]
    if: github.event_name == 'workflow_run' && needs.source.outputs.eligible == 'true'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_ENVIRONMENT: staging
      RELEASE_STAGING_CONFIG: ${{ vars.RELEASE_STAGING_CONFIG }}
      RELEASE_PRODUCTION_CONFIG: ${{ vars.RELEASE_PRODUCTION_CONFIG }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      QUALITY_RUN_ID: ${{ needs.source.outputs.quality_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
      DB_ADOPTION_PROOF_JSON: ${{ secrets.DB_ADOPTION_PROOF_JSON }}
      DB_ADOPTION_BACKUP_BASE64: ${{ secrets.DB_ADOPTION_BACKUP_BASE64 }}
      DB_ADOPTION_BACKUP_BASE64_1: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_1 }}
      DB_ADOPTION_BACKUP_BASE64_2: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_2 }}
      DB_ADOPTION_BACKUP_BASE64_3: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_3 }}
      DB_ADOPTION_BACKUP_BASE64_4: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_4 }}
      DB_ADOPTION_BACKUP_BASE64_5: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_5 }}
      DB_ADOPTION_BACKUP_BASE64_6: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_6 }}
      DB_ADOPTION_BACKUP_BASE64_7: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_7 }}
      DB_ADOPTION_BACKUP_BASE64_8: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_8 }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: staging-${{ github.run_id }}
          path: release-artifact
      - run: node scripts/release/cli.mjs preflight
      - name: Checkpoint, guarded forward migrations, Worker, readiness, Pages
        run: node scripts/release/cli.mjs deploy
      - name: Ensure machine-readable job outcome even if setup/install failed
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync(".release",{recursive:true}); if(!fs.existsSync(".release/report.json")) fs.writeFileSync(".release/report.json",JSON.stringify({status:process.env.JOB_RESULT,runId:process.env.GITHUB_RUN_ID,reason:"setup or dependency installation did not complete"}));'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-result-${{ github.run_id }}
          path: |
            .release/report.json
            .release/checkpoint.json
            .release/release.json
          retention-days: 90
          if-no-files-found: warn

  production:
    needs: source
    if: github.event_name == 'workflow_dispatch' && needs.source.outputs.eligible == 'true'
    # Required reviewers + prevent self-review + no admin bypass must be configured;
    # source and CLI verify protection via API and fail closed if unavailable.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_ENVIRONMENT: production
      PRODUCTION_APPROVAL_CONFIGURED: ${{ vars.PRODUCTION_APPROVAL_CONFIGURED }}
      PRODUCTION_APPROVAL_MODE: ${{ vars.PRODUCTION_APPROVAL_MODE }}
      RELEASE_STAGING_CONFIG: ${{ vars.RELEASE_STAGING_CONFIG }}
      RELEASE_PRODUCTION_CONFIG: ${{ vars.RELEASE_PRODUCTION_CONFIG }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      QUALITY_RUN_ID: ${{ needs.source.outputs.quality_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
      DB_ADOPTION_PROOF_JSON: ${{ secrets.DB_ADOPTION_PROOF_JSON }}
      DB_ADOPTION_BACKUP_BASE64: ${{ secrets.DB_ADOPTION_BACKUP_BASE64 }}
      DB_ADOPTION_BACKUP_BASE64_1: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_1 }}
      DB_ADOPTION_BACKUP_BASE64_2: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_2 }}
      DB_ADOPTION_BACKUP_BASE64_3: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_3 }}
      DB_ADOPTION_BACKUP_BASE64_4: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_4 }}
      DB_ADOPTION_BACKUP_BASE64_5: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_5 }}
      DB_ADOPTION_BACKUP_BASE64_6: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_6 }}
      DB_ADOPTION_BACKUP_BASE64_7: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_7 }}
      DB_ADOPTION_BACKUP_BASE64_8: ${{ secrets.DB_ADOPTION_BACKUP_BASE64_8 }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - name: Download already-built production artifact from successful staging run (never rebuild)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: production-${{ needs.source.outputs.stage_run_id }}
          run-id: ${{ needs.source.outputs.stage_run_id }}
          github-token: ${{ github.token }}
          path: release-artifact
      - run: node scripts/release/cli.mjs preflight
      - run: node scripts/release/cli.mjs deploy
      - name: Ensure machine-readable job outcome even if setup/install failed
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync(".release",{recursive:true}); if(!fs.existsSync(".release/report.json")) fs.writeFileSync(".release/report.json",JSON.stringify({status:process.env.JOB_RESULT,runId:process.env.GITHUB_RUN_ID,reason:"setup or dependency installation did not complete"}));'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-result-${{ github.run_id }}
          path: |
            .release/report.json
            .release/checkpoint.json
            .release/release.json
          retention-days: 90
          if-no-files-found: warn
